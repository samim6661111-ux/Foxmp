name: FoxMP build
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "(optional) direct download URL of your GTA V APK -> workflow also produces the patched, signed APK"
        required: false
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unflatten files into folders
        run: |
          python3 - <<'PY'
          import os, shutil
          for f in sorted(os.listdir('.')):
              if '__' in f and os.path.isfile(f) and not f.startswith('.'):
                  t = f.replace('__', '/'); os.makedirs(os.path.dirname(t), exist_ok=True); shutil.move(f, t)
          PY
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Server tests
        run: python3 tests/test_server.py
      - name: SDK pieces
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_JAR=$ANDROID_HOME/platforms/android-34/android.jar" >> $GITHUB_ENV
          mkdir -p tools_bin && curl -sL -o tools_bin/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
      - name: Build libfoxmp.so (arm64)
        run: |
          cmake -S native -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j4
          mkdir -p out && cp build/libfoxmp.so out/
      - name: Compile client dex
        run: |
          mkdir -p stubs cls out/dex
          javac -source 8 -target 8 -nowarn -cp $ANDROID_JAR -d stubs client_stubs/com/gtavsource/android/*.java
          javac -source 8 -target 8 -nowarn -cp $ANDROID_JAR:stubs -d cls client/com/gtavsource/android/*.java
          java -cp $ANDROID_HOME/build-tools/34.0.0/lib/d8.jar com.android.tools.r8.D8 --min-api 26 --lib $ANDROID_JAR --classpath stubs --output out/dex $(find cls -name '*.class')
      - name: Patch APK (only if apk_url given)
        if: ${{ github.event.inputs.apk_url != '' }}
        run: |
          curl -L -o in.apk "${{ github.event.inputs.apk_url }}"
          python3 tools/patch_apk.py in.apk out/GTAV-foxmp.apk --tools tools_bin --libfoxmp out/libfoxmp.so --android-jar $ANDROID_JAR
      - uses: actions/upload-artifact@v4
        with: { name: foxmp-build, path: "out/**" }
